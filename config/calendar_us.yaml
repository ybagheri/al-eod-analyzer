# US cash-session calendar (S3, Phase 5b).
# Holidays follow NYSE/ICE futures conventions; extend backward as market-data
# coverage grows. Half days close at 13:00 ET.
schema_version: 1
timezone: "America/New_York"
session:
  regular_open: "09:30"
  regular_close: "16:00"
  half_day_close: "13:00"
bar_interval_minutes: 5
dst:
  rule: "us"  # second Sunday in March -> first Sunday in November, 02:00 local
holidays_full:
  - "2026-01-01"
  - "2026-01-19"
  - "2026-02-16"
  - "2026-05-25"
  - "2026-06-19"
  - "2026-07-03"
  - "2026-09-07"
  - "2026-11-26"
  - "2026-12-25"
holidays_half:
  - "2026-11-27"